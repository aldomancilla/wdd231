<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>San Jose Pinula Chamber - Directory</title>
    <link rel="stylesheet" href="styles/normalize.css" />

    <script src="scripts/script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
    <link rel="icon" href="favicon.ico" />

    <meta property="og:title" content="Pinula Chamber Commerce" />
    <meta
      property="og:description"
      content="Dynamic online community that supports business growth in Pinula, Guatemala. The site will feature
        local business directories."
    />
    <meta
      property="og:url"
      content="https://github.com/aldomancilla/WDD231/chamber/directory.html"

  <body>
    <main>
      <header>
        <div class="header-container">
          <div class="hle">
            <img

          </div>
          <div class="hr">
            <nav>
              <button id="hambutton"></button>
              <ul class="navigation">
                <li><a href="#" title="Home">Home</a></li>
                <li>
                  <a href="#" title="Discover" class="active">Discover</a>
                </li>
                <li class="current-menu-item">
                  <a href="#" title="Directory">Directory</a>
                </li>
                <li><a href="#" title="Join">Join</a></li>
              </ul>
            </nav>
          </div>
        </div>
      </header>
      <h1>Business Directory</h1>
      <div class="menu">
        <button id="grid">Grid View</button>
        <button id="list">List View</button>

      <article class="members"></article>

      <footer>
        <div class="footer-container">
          <!-- Address -->
          <div class="footer-column left">
            <p>
              Fake Avenue 123, San Jose Pinula, ZC 01052 | Telephone: (502)
              2020-3030
            </p>
          </div>

          <!-- Social Media -->
          <div class="footer-column center">
            <a href="https://www.facebook.com" target="_blank">
              <img
                src="images/facebook.png"
                alt="Facebook"
                class="social-icon"

            </a>
            <a href="https://www.instagram.com" target="_blank">
              <img
                src="images/instagram.png"
                alt="Instagram"
                class="social-icon"
              />
            </a>
            <a href="https://www.youtube.com" target="_blank">
              <img src="images/youtube.png" alt="Youtube" class="social-icon" />
            </a>
          </div>

          <!-- Copyright -->
          <div class="footer-column right">
            <p>
              WWD 231 Class Project<br />Aldo Mancilla<br />©
              <span id="year"> </span> Pinula Chamber, Guatemala
            </p>
            <p id="lastModified"></p>
          </div>
        </div>
